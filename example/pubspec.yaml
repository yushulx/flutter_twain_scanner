name: flutter_twain_scanner_example
description: Demonstrates how to use the flutter_twain_scanner package.
publish_to: 'none'

environment:
  sdk: ^3.2.0

dependencies:
  flutter:
    sdk: flutter

  flutter_twain_scanner:
    # When depending on this package from a real application you should use:
    #   flutter_twain_scanner: ^x.y.z
    # See https://dart.dev/tools/pub/dependencies#version-constraints
    # The example app is bundled with the package so we use a path dependency on
    # the parent directory to use the current package's version.
    path: ../

  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

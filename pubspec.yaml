name: flutter_twain_scanner
description: >-
  A cross-platform Dart/Flutter package for digitizing documents from TWAIN,
  WIA, SANE, ICA and eSCL compatible scanners through the Dynamic Web TWAIN
  Service REST API.
version: 3.0.0
homepage: https://github.com/yushulx/flutter_twain_scanner
repository: https://github.com/yushulx/flutter_twain_scanner
issue_tracker: https://github.com/yushulx/flutter_twain_scanner/issues
topics:
  - scanner
  - twain
  - document
  - pdf

environment:
  sdk: ^3.2.0

dependencies:
  http: ^1.2.2
  path: ^1.9.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.8
